<!DOCTYPE html>

<html lang="ja">

<head>
    <meta charset="UTF-8"/>
    <title>カレンダー</title>

	<!--Google Fonts-->
	<link rel="preconnect" href="https://fonts.googleapis.com"/>
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet"/>
	
    <!-- CSSファイルの読み込み -->
	<link rel="stylesheet" href="{{ url_for('static', filename='css/sanitize.css') }}"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>

<body>
	<!-- from Flask to JavaScript -->
	<script>
		const selectedDate = "{{date or ''}}";
		const event_dates = {{event_dates | tojson}};
	</script>
	
	<div class="container">

		<div class="calendar-area">
			<h1>カレンダー</h1>
			<h2 id="month"></h2>

			<div class="switch-month">
				<table class="calendar-table">
					<thead>
						<tr>
							<th>日</th>
							<th>月</th>
							<th>火</th>
							<th>水</th>
							<th>木</th>
							<th>金</th>
							<th>土</th>
						</tr>
					</thead>

					<tbody id="calendar">
					</tbody>
				</table>
		
				<button id="previous-month">←</button>
				<button id="next-month">→</button>
			</div>
		
			<p class="add-schedule">
				予定の追加は
				<a href="{{url_for('add_events')}}" class="add-schedule-link">こちら</a>
				から
			</p>
		</div>

		<div class="schedule">
			{% if date %}
			<h2>{{date}}の予定</h2>
			{% else %}
			<h2>日付を選択してください</h2>
			{% endif %}
		
			{% if not dayevents %}
			<p>予定がありません。</p>
			{% else %}
			{% for event in dayevents %}
	
			<div>
				<p>タイトル：{{event.title}}</p>
				<p>時刻：{{event.start_time}}～{{event.end_time}}</p>
				<p>コメント：{{event.description}}</p>
				<div class="button-line">
					<button onclick="location.href='{{url_for('edit_event', event_id=event.id)}}'">編集</button>
			
					<button class="delete-event" data-event-id="{{event.id}}" data-event-title="{{event.title}}">削除</button>
				</div>
			</div>
			<br/>
	
			{% endfor %}
			{% endif %}
		</div>
		
	</div>

	<!-- JavaScript ファイルの読み込み-->
	<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
